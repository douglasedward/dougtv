syntax = "proto3";
package dougtv.chat.v1;

option go_package = "github.com/douglasedward/dougtv/packages/proto/gen/go/chat/v1";

service ChatService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
}

message SendMessageRequest {
  string channel_id = 1;
  string user_id = 2;
  string content = 3;
}

message SendMessageResponse {
  string message_id = 1;
}
