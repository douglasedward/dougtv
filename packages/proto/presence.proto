syntax = "proto3";
package dougtv.presence.v1;

option go_package = "github.com/douglasedward/dougtv/packages/proto/gen/go/presence/v1";

service PresenceService {
  rpc RecordHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetViewerCount(ViewerCountRequest) returns (ViewerCountResponse);
}

message HeartbeatRequest {
  string channel_id = 1;
  string session_id = 2;
}

message HeartbeatResponse {}

message ViewerCountRequest {
  string channel_id = 1;
}

message ViewerCountResponse {
  int64 count = 1;
}
