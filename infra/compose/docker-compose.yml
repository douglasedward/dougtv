# Full production-like stack.
# Build images first: docker compose build
# Then: docker compose up
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dougtv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: dougtv
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  nats:
    image: nats:2.10-alpine
    command: ["--jetstream", "--store_dir=/data"]
    volumes:
      - nats_data:/data
    restart: unless-stopped

  identity:
    build:
      context: ../..
      dockerfile: services/control/identity/Dockerfile
    environment:
      DATABASE_URL: postgres://dougtv:${POSTGRES_PASSWORD}@postgres:5432/dougtv
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  channel:
    build:
      context: ../..
      dockerfile: services/control/channel/Dockerfile
    environment:
      DATABASE_URL: postgres://dougtv:${POSTGRES_PASSWORD}@postgres:5432/dougtv
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  nats_data:
